# GitHub Pages로 배포 (main에 push되면 자동, 수동 실행도 가능)
# 사용 전: 저장소를 공개로 하고 Settings → Pages → Source를 "GitHub Actions"로 설정
# 비공개 저장소는 무료 요금제에서 Pages 불가 → 공개 전에는 deploy 단계가 실패함
# 주소: https://<계정>.github.io/<저장소 이름>/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
